{% extends "compromissos/base.html" %}
{% load static %}

{% block conteudo %}
<section id="tabela_compromisso">
    <div>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Nome</th>
                    <th>Situação</th>
                </tr>
            </thead>
            <tbody>
                {% for compromisso in compromissos %}
                <tr class="compromisso" data-horario="{{ compromisso.data }}T{{ compromisso.horario }}">
                    <td>{{ compromisso.data|date:"d-m-Y" }}</td>
                    <td>{{ compromisso.horario }}</td>
                    <td>{{ compromisso.nome }}</td>
                    <td>{{ compromisso.situacao }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock conteudo %}

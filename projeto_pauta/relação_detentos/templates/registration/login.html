{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" href="https://www.sap.sc.gov.br/wp-content/uploads/2014/03/PP-COLORIDO-PNG.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="{% static 'css/style_login.css' %}"> -->
    <style>
        * {
            margin: 0;
            border: 0;
            padding: 0;
        }

        .container {
            margin: 0;
            margin-top: 200px;
        }

        .flex {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding-right: 150px;
        }

        .card {
            text-align: center;
            background-color: rgb(194, 199, 199);
            padding-bottom: 20px;
        }

        .oculta {
            display: none;
        }
    </style>
</head>

<body class="text-center">
    <div class="flex">
        <div class="container">
            <img src="https://www.sap.sc.gov.br/wp-content/uploads/2014/03/PP-COLORIDO-PNG.png" alt="" height="200">
        </div>
        <div class="container card">

            <h1>Login</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Entrar</button>
            </form>
        </div>

    </div>
</body>

</html>

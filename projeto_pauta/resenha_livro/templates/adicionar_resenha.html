{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Adicionar Resenha de Livro</title>
    <link rel="stylesheet" href="{% static 'resenha_livro/css/style.css' %}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h1>Adicionar Resenha de Livro</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
        <button class="btn">
            <a href="{% url 'resenha_livro:listar_alunos' %}"> Voltar</a>
        </button> <br>
        <!-- Botão para abrir o popup de adicionar aluno -->
        <button class="btn btn-secondary btn-sm" onclick="openPopup()">Adicionar Aluno</button>

    </div>
    <script>
        // Função para abrir o popup de adicionar aluno
        function openPopup() {
            const popupUrl = "{% url 'resenha_livro:adicionar_aluno_popup' %}";
            const popupWindow = window.open(popupUrl, "Adicionar Aluno", "width=300,height=400,resizable=yes,scrollbars=yes");
            popupWindow.focus();
        }
    </script>

</body>

</html>

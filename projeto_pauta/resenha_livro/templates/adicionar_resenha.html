{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="bg-[#f1eee8] text-gray-800 font-sans min-h-screen flex items-center justify-center">

    <div class="max-w-lg w-full bg-white p-6 rounded shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">{{ titulo }}</h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                💾 Salvar
            </button>
        </form>

        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mt-6">
            <a href="{% url 'resenha_livro:listar_alunos' %}"
                class="bg-gray-600 text-white px-4 py-2 rounded text-center hover:bg-gray-700 transition w-full sm:w-auto">
                🔙 Voltar
            </a>

            <button type="button"
                hx-get="{% url 'resenha_livro:adicionar_aluno_popup' %}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition w-full sm:w-auto">
                ➕ Adicionar Aluno
            </button>
        </div>
    </div>

    <div id="modal-container"></div>

    <script>
        function fecharModalResenha() {
            const modal = document.getElementById('modal-resenha-overlay');
            if (modal) {
                modal.remove();
            }
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                fecharModalResenha();
            }
        });

        document.body.addEventListener('alunoAdicionado', function () {
            fecharModalResenha();
            window.location.reload();
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container mt-4">
        <h1>{{ titulo }}</h1>
        <p>{{ nome_unidade }}</p>
        <p>Última atualização: {{ data_atualizado }}</p>

        <!-- Gráfico Regimes -->
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header">Regimes</div>
                    <div class="card-body">
                        <canvas id="regimesChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Gráfico Local de Alocação -->
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header">Local de Alocação</div>
                    <div class="card-body">
                        <canvas id="alocacoesChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Gráfico Artigos -->
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header">Artigos</div>
                    <div class="card-body">
                        <canvas id="artigosChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Gráfico Comarcas -->
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header">Comarcas</div>
                    <div class="card-body">
                        <canvas id="comarcasChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função para gerar cor aleatória
        function randomColor(alpha = 0.5) {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgba(${r},${g},${b},${alpha})`;
        }
        function randomColorsArray(length, alpha = 0.5) {
            return Array.from({ length }, () => randomColor(alpha));
        }

        // Dados vindos do contexto Django
        const regimes = {{ regimes| safe }};
        const alocacoes = {{ alocacoes| safe }};
        const artigos = {{ artigos| safe }};
        const comarcas = {{ comarcas| safe }};

        // Regimes
        const regimesLabels = regimes.map(item => item.regime);
        const regimesData = regimes.map(item => item.quantidade);
        const regimesColors = randomColorsArray(regimesLabels.length);

        // Local de Alocação
        const alocacoesLabels = alocacoes.map(item => item.local_alocacao);
        const alocacoesData = alocacoes.map(item => item.quantidade);
        const alocacoesColors = randomColorsArray(alocacoesLabels.length);

        // Artigos
        const artigosLabels = artigos.map(item => item.artigo.length > 20 ? item.artigo.substring(0, 20) + '...' : item.artigo);
        const artigosData = artigos.map(item => item.quantidade);
        const artigosColors = randomColorsArray(artigosLabels.length);

        // Comarcas
        const comarcasLabels = comarcas.map(item => item.comarca);
        const comarcasData = comarcas.map(item => item.quantidade);
        const comarcasColors = randomColorsArray(comarcasLabels.length);

        // Gráfico de regimes
        new Chart(document.getElementById('regimesChart'), {
            type: 'bar',
            data: {
                labels: regimesLabels,
                datasets: [{
                    label: 'Quantidade',
                    data: regimesData,
                    backgroundColor: regimesColors
                }]
            }
        });

        // Gráfico de alocação
        new Chart(document.getElementById('alocacoesChart'), {
            type: 'bar',
            data: {
                labels: alocacoesLabels,
                datasets: [{
                    label: 'Quantidade',
                    data: alocacoesData,
                    backgroundColor: alocacoesColors
                }]
            }
        });

        // Gráfico de artigos
        new Chart(document.getElementById('artigosChart'), {
            type: 'bar',
            data: {
                labels: artigosLabels,
                datasets: [{
                    label: 'Quantidade',
                    data: artigosData,
                    backgroundColor: artigosColors
                }]
            }
        });

        // Gráfico de comarcas
        new Chart(document.getElementById('comarcasChart'), {
            type: 'bar',
            data: {
                labels: comarcasLabels,
                datasets: [{
                    label: 'Quantidade',
                    data: comarcasData,
                    backgroundColor: comarcasColors
                }]
            }
        });
    </script>
</body>

</html>

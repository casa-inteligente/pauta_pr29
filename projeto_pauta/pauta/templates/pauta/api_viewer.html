{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - API Viewer</title>
    <link rel="icon" href="https://www.sap.sc.gov.br/wp-content/uploads/2014/03/PP-COLORIDO-PNG.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white py-6 shadow-lg">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fas fa-calendar-alt"></i>
                {{ titulo }}
            </h1>
            <p class="text-blue-100 mt-2">{{ nome_unidade }}</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Controles -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-calendar-day"></i> Data Início
                    </label>
                    <input type="date" id="dataInicio" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-calendar-day"></i> Data Fim
                    </label>
                    <input type="date" id="dataFim" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>                
            </div>

            <!-- Info da API -->
            <div class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
                <div class="flex items-start gap-3">
                    <i class="fas fa-info-circle text-blue-600 text-xl"></i>
                    <div>
                        <p class="text-sm text-gray-700">
                            <strong>Endpoint API:</strong> 
                            <code class="bg-gray-200 px-2 py-1 rounded text-xs" id="apiEndpoint">{% url 'pauta:api_pauta_4dias' %}</code>
                        </p>
                        <p class="text-sm text-gray-600 mt-1">
                            Total de registros: <span id="totalRegistros" class="font-bold text-blue-600">0</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-8">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
            <p class="text-gray-600 mt-4">Carregando dados...</p>
        </div>

        <!-- Erro -->
        <div id="erro" class="hidden bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-lg mb-6">
            <div class="flex items-center gap-3">
                <i class="fas fa-exclamation-triangle text-2xl"></i>
                <div>
                    <p class="font-semibold">Erro ao carregar dados</p>
                    <p id="erroMensagem" class="text-sm"></p>
                </div>
            </div>
        </div>

        <!-- Pautas -->
        <div id="pautasContainer" class="space-y-4">
            <!-- Pautas serão inseridas aqui via JavaScript -->
        </div>

        <!-- Mensagem vazia -->
        <div id="vazioMensagem" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-700 px-6 py-8 rounded-lg text-center">
            <i class="fas fa-inbox text-4xl mb-4"></i>
            <p class="text-lg font-semibold">Nenhuma pauta encontrada</p>
            <p class="text-sm mt-2">Tente ajustar os filtros de data</p>
        </div>
    </main>

    <script>
        // URLs das APIs usando template tags do Django
        const API_4DIAS_URL = "{% url 'pauta:api_pauta_4dias' %}";
        const API_DATA_URL = "{% url 'pauta:api_pauta_por_data' %}";

        // Configurar datas padrão
        const hoje = new Date();
        const dataFimDefault = new Date();
        dataFimDefault.setDate(hoje.getDate() + 4);

        document.getElementById('dataInicio').valueAsDate = hoje;
        document.getElementById('dataFim').valueAsDate = dataFimDefault;

        // Carregar pautas dos próximos 4 dias ao carregar a página
        window.addEventListener('DOMContentLoaded', carregar4Dias);

        function formatarData(dataStr) {
            const data = new Date(dataStr + 'T00:00:00');
            const opcoes = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            return data.toLocaleDateString('pt-BR', opcoes);
        }

        function formatarHora(horaStr) {
            if (!horaStr) return '-';
            return horaStr.substring(0, 5);
        }

        function mostrarLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('pautasContainer').innerHTML = '';
            document.getElementById('erro').classList.add('hidden');
            document.getElementById('vazioMensagem').classList.add('hidden');
        }

        function esconderLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function mostrarErro(mensagem) {
            document.getElementById('erro').classList.remove('hidden');
            document.getElementById('erroMensagem').textContent = mensagem;
            esconderLoading();
        }

        function mostrarVazio() {
            document.getElementById('vazioMensagem').classList.remove('hidden');
            esconderLoading();
        }

        function renderizarPautas(data) {
            const container = document.getElementById('pautasContainer');
            container.innerHTML = '';

            if (!data.pautas || data.pautas.length === 0) {
                mostrarVazio();
                return;
            }

            document.getElementById('totalRegistros').textContent = data.total;

            // Agrupar por data
            const pautasPorData = {};
            data.pautas.forEach(pauta => {
                if (!pautasPorData[pauta.data]) {
                    pautasPorData[pauta.data] = [];
                }
                pautasPorData[pauta.data].push(pauta);
            });

            // Renderizar cada data
            Object.keys(pautasPorData).sort().forEach(data => {
                const dataDiv = document.createElement('div');
                dataDiv.className = 'bg-white rounded-lg shadow-md overflow-hidden';
                
                // Cabeçalho da data
                const header = document.createElement('div');
                header.className = 'bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-4';
                header.innerHTML = `
                    <h2 class="text-xl font-bold flex items-center gap-3">
                        <i class="fas fa-calendar-day"></i>
                        ${formatarData(data)}
                    </h2>
                `;
                dataDiv.appendChild(header);

                // Lista de pautas
                const lista = document.createElement('div');
                lista.className = 'divide-y divide-gray-200';

                pautasPorData[data].forEach(pauta => {
                    const item = document.createElement('div');
                    item.className = 'px-6 py-4 hover:bg-gray-50 transition';
                    item.innerHTML = `
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0">
                                <div class="bg-blue-100 text-blue-600 rounded-full w-12 h-12 flex items-center justify-center font-bold">
                                    <i class="fas fa-clock"></i>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="bg-blue-500 text-white px-3 py-1 rounded-full text-sm font-semibold">
                                        ${formatarHora(pauta.hora)}
                                    </span>
                                    ${pauta.prioridade ? '<span class="bg-red-500 text-white px-2 py-1 rounded text-xs font-semibold"><i class="fas fa-exclamation-circle"></i> Urgente</span>' : ''}
                                </div>
                                <h3 class="text-lg font-semibold text-gray-800 mb-1">
                                    ${pauta.titulo || pauta.nome || 'Verificar com os responsáveis'}
                                </h3>
                                ${pauta.situacao ? `<p class="text-gray-600 text-sm">${pauta.situacao}</p>` : ''}
                                
                            </div>
                        </div>
                    `;
                    lista.appendChild(item);
                });

                dataDiv.appendChild(lista);
                container.appendChild(dataDiv);
            });

            esconderLoading();
        }

        async function carregar4Dias() {
            mostrarLoading();
            document.getElementById('apiEndpoint').textContent = API_4DIAS_URL;

            try {
                const response = await fetch(API_4DIAS_URL);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    renderizarPautas(data);
                } else {
                    mostrarErro(data.error || 'Erro desconhecido');
                }
            } catch (error) {
                console.error('Erro detalhado:', error);
                mostrarErro(error.message);
            }
        }

        async function carregarPautas() {
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;

            if (!dataInicio || !dataFim) {
                alert('Por favor, selecione as datas de início e fim');
                return;
            }

            mostrarLoading();
            const endpoint = `${API_DATA_URL}?data_inicio=${dataInicio}&data_fim=${dataFim}`;
            document.getElementById('apiEndpoint').textContent = endpoint;

            try {
                const response = await fetch(endpoint);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    renderizarPautas(data);
                } else {
                    mostrarErro(data.error || 'Erro desconhecido');
                }
            } catch (error) {
                console.error('Erro detalhado:', error);
                mostrarErro(error.message);
            }
        }
    </script>
</body>
</html>

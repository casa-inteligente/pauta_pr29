{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block main_content %}
<section class="mx-auto max-w-5xl px-4 py-8">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Configurações do usuário</h2>
        <p class="mt-1 text-sm text-slate-500">
            Gerencie seus dados de acesso e informações pessoais.
        </p>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
        <button type="button"
                hx-get="{% url 'config_user_dados' %}"
                hx-target="#modal-config-user"
                hx-swap="innerHTML"
                class="rounded-lg border border-slate-200 bg-white p-5 text-left shadow-sm transition hover:border-green-600 hover:shadow-md">
            <div class="mb-3 inline-flex h-10 w-10 items-center justify-center rounded-lg bg-green-50 text-green-700">
                <i class="fas fa-id-card"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-800">Dados pessoais</h3>
            <p class="mt-1 text-sm text-slate-500">Atualize nome, sobrenome e e-mail.</p>
        </button>

        <button type="button"
                hx-get="{% url 'config_user_senha' %}"
                hx-target="#modal-config-user"
                hx-swap="innerHTML"
                class="rounded-lg border border-slate-200 bg-white p-5 text-left shadow-sm transition hover:border-green-600 hover:shadow-md">
            <div class="mb-3 inline-flex h-10 w-10 items-center justify-center rounded-lg bg-red-50 text-red-700">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-800">Senha</h3>
            <p class="mt-1 text-sm text-slate-500">Altere sua senha de acesso ao sistema.</p>
        </button>
    </div>
</section>

<div id="modal-config-user"></div>
{% endblock %}

{% block scripts %}
<script>
    function fecharModalConfigUser() {
        document.getElementById("modal-config-user").innerHTML = "";
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            fecharModalConfigUser();
        }
    });
</script>
{% endblock %}
